<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - L&A Contabilidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/portal.css">
  <link rel="stylesheet" href="/static/css/team.css">
</head>
<body>
  <div class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand fw-bold" href="/">L&A Contabilidade</a>
        <span class="navbar-text ms-lg-auto me-lg-3">Olá, <span data-user-name></span></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
      </div>
    </nav>

    <div class="flex-grow-1 p-3 p-md-4 bg-light">
      <div class="page-header mb-4">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Resumo da operação da L&A Contabilidade</p>
      </div>

      <div id="statsContainer" class="row g-3">
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100 skeleton">
            <div class="card-body">
              <div class="skeleton-line" style="width: 60%;"></div>
              <div class="skeleton-line" style="width: 40%; margin-bottom: 0;"></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100 skeleton">
            <div class="card-body">
              <div class="skeleton-line" style="width: 60%;"></div>
              <div class="skeleton-line" style="width: 40%; margin-bottom: 0;"></div>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100 skeleton">
            <div class="card-body">
              <div class="skeleton-line" style="width: 60%;"></div>
              <div class="skeleton-line" style="width: 40%; margin-bottom: 0;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/portal.js"></script>
  <script src="/static/js/team/dashboard.js"></script>
</body>
</html>
