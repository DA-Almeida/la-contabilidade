version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: la-contabilidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-la_contabilidade}
      POSTGRES_USER: ${POSTGRES_USER:-la_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-la_password}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-la_user} -d ${POSTGRES_DB:-la_contabilidade}"]
      interval: 10s
      timeout: 5s
      retries: 5