<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clientes - L&A Contabilidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/portal.css">
  <link rel="stylesheet" href="/static/css/team.css">
</head>
<body>
  <div class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand fw-bold" href="/">L&A Contabilidade</a>
        <span class="navbar-text ms-lg-auto me-lg-3">Olá, <span data-user-name></span></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
      </div>
    </nav>

    <div class="flex-grow-1 p-3 p-md-4 bg-light">
      <div class="page-header mb-4">
        <h1 class="page-title">Clientes</h1>
        <p class="page-subtitle">Gestão de clientes do escritório</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card">
            <div class="card-header"><h5>Cadastrar novo cliente</h5></div>
            <div class="card-body">
              <form id="customerForm" onsubmit="submitCustomer(event)">
                <div class="mb-3"><label class="form-label">Razão social *</label><input class="form-control" name="legal_name" required></div>
                <div class="mb-3"><label class="form-label">Nome fantasia</label><input class="form-control" name="trade_name"></div>
                <div class="mb-3"><label class="form-label">CNPJ/CPF *</label><input class="form-control" name="tax_id" required></div>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Tipo *</label><select class="form-select" name="person_type" required><option value="PJ">PJ</option><option value="PF">PF</option></select></div>
                  <div class="col-md-6"><label class="form-label">Regime *</label><input class="form-control" name="tax_regime" required></div>
                </div>
                <div class="mb-3"><label class="form-label">Mensalidade</label><input class="form-control" name="monthly_fee" type="number" min="0" step="0.01"></div>
                <button type="submit" class="btn btn-primary w-100">Salvar cliente</button>
                <p class="feedback mt-3 mb-0" role="status"></p>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h5 class="mb-0">Lista de clientes</h5>
              <button class="btn btn-sm btn-outline-secondary" onclick="loadCustomers()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="card-body">
              <div class="table-wrapper">
                <table class="table table-hover mb-0">
                  <thead><tr><th>Razão Social</th><th>CNPJ/CPF</th><th>Regime</th><th>Mensalidade</th><th>Status</th></tr></thead>
                  <tbody id="customersBody"><tr><td colspan="5" class="text-center py-4">Carregando...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/portal.js"></script>
  <script src="/static/js/team/customers.js"></script>
</body>
</html>
