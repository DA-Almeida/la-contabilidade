<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Colaboradores - L&A Contabilidade</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/portal.css">
  <link rel="stylesheet" href="/static/css/team.css">
</head>
<body>
  <div class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid px-lg-4">
        <a class="navbar-brand fw-bold" href="/">L&A Contabilidade</a>
        <span class="navbar-text ms-lg-auto me-lg-3">Olá, <span data-user-name></span></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
      </div>
    </nav>

    <div class="flex-grow-1 p-3 p-md-4 bg-light">
      <div class="page-header mb-4">
        <h1 class="page-title">Colaboradores</h1>
        <p class="page-subtitle">Gestão de colaboradores do escritório</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card">
            <div class="card-header"><h5>Cadastrar colaborador</h5></div>
            <div class="card-body">
              <form id="employeeForm" onsubmit="submitEmployee(event)">
                <div class="mb-3"><label class="form-label">Nome *</label><input class="form-control" name="name" required></div>
                <div class="mb-3"><label class="form-label">E-mail *</label><input class="form-control" name="email" type="email" required></div>
                <div class="mb-3"><label class="form-label">Departamento *</label><input class="form-control" name="department" required></div>
                <div class="mb-3"><label class="form-label">Cargo *</label><input class="form-control" name="job_title" required></div>
                <div class="mb-3">
                  <label class="form-label">Usuário da equipe</label>
                  <select class="form-select" name="user_id" id="teamUserSelect"><option value="">Carregando...</option></select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Salvar colaborador</button>
                <p class="feedback mt-3 mb-0" role="status"></p>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h5 class="mb-0">Lista de colaboradores</h5>
              <button class="btn btn-sm btn-outline-secondary" onclick="loadEmployees()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="card-body">
              <div class="table-wrapper">
                <table class="table table-hover mb-0">
                  <thead><tr><th>Nome</th><th>Departamento</th><th>Cargo</th><th>Status</th></tr></thead>
                  <tbody id="employeesBody"><tr><td colspan="4" class="text-center py-4">Carregando...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/portal.js"></script>
  <script src="/static/js/team/employees.js"></script>
</body>
</html>
