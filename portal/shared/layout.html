<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>L&A Contabilidade - Área da Equipe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/portal/shared/portal.css">
  <style>
    :root {
      --sidebar-width: 260px;
    }
    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }
    .navbar {
      flex-shrink: 0;
    }
    .container-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: var(--sidebar-width);
      background: #f8f9fa;
      border-right: 1px solid #e9ecef;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      background: #f8f9fa;
    }
    @media (max-width: 768px) {
      :root {
        --sidebar-width: 0;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: calc(100vh - 56px);
        margin-top: 56px;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 1000;
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .container-wrapper {
        flex-direction: column;
      }
    }
  </style>
  <script>const layoutConfig = { sidebarVisible: window.innerWidth >= 768 };</script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand fw-bold" href="/">L&A Contabilidade</a>
      <button class="navbar-toggler" type="button" id="sidebarToggle">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="teamNav">
        <span class="navbar-text ms-lg-auto me-lg-3">Olá, <span data-user-name></span></span>
        <button class="btn btn-outline-light btn-sm" onclick="window.portalApp.logout()">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container-wrapper">
    <div class="sidebar" id="mainSidebar">
      <nav class="nav flex-column p-3">
        <a href="/portal/equipe" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="dashboard">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
        <a href="/portal/equipe/clientes" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="customers">
          <i class="bi bi-people"></i>
          <span>Clientes</span>
        </a>
        <a href="/portal/equipe/colaboradores" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="employees">
          <i class="bi bi-person-check"></i>
          <span>Colaboradores</span>
        </a>
        <a href="/portal/equipe/tarefas" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="tasks">
          <i class="bi bi-kanban"></i>
          <span>Tarefas</span>
        </a>
        <a href="/portal/equipe/atribuicoes" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="assignments">
          <i class="bi bi-diagram-3"></i>
          <span>Atribuições</span>
        </a>
        <hr class="my-2">
        <a href="/portal/equipe/tickets" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="tickets">
          <i class="bi bi-chat-dots"></i>
          <span>Tickets</span>
        </a>
        <a href="/portal/equipe/guias" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="guides">
          <i class="bi bi-book"></i>
          <span>Guias</span>
        </a>
        <a href="/portal/equipe/obrigacoes" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="obligations">
          <i class="bi bi-clipboard-check"></i>
          <span>Obrigações</span>
        </a>
        <div class="admin-only" style="display: none;">
          <hr class="my-2">
          <a href="/portal/equipe/usuarios" class="nav-link nav-item-link d-flex align-items-center gap-2" data-page="users">
            <i class="bi bi-shield-lock"></i>
            <span>Usuários</span>
          </a>
        </div>
      </nav>
    </div>

    <main class="main-content p-3 p-md-4 flex-grow-1">
      <div id="pageContent"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/portal.js"></script>
  <script src="/portal/shared/app.js"></script>
  <script src="/portal/team/modules.js"></script>
</body>
</html>
